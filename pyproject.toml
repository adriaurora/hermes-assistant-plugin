[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-assistant-plugin"
version = "0.1.0"
description = "Hermes Assistant durable Android inbox platform plugin"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<0.29", "PyJWT[crypto]>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio", "aiohttp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
